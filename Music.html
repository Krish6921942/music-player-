<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Music Player</title>
    <link rel="stylesheet" href="Music.css"> <!-- We'll create this next -->
</head>
<body>
    <div class="player">
        <h2>My Music Player</h2>
        
        <!-- Audio element (hidden) -->
        <audio id="audio" src="song.mp3/song1.mp3.mp3"></audio>
        
        <!-- Song info (you can customize this) -->
        <div class="song-info">
            <p>Chaahat</p>
            <p>RFAK</p>
        </div>
        
        <!-- Progress bar -->
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="progress" min="0" max="100" value="0" class="progress-bar">
            <span id="duration">0:00</span>
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <button id="play-pause">Play</button>
            <button id="volume-btn">🔊</button>
            <input type="range" id="volume" min="0" max="100" value="50" class="volume-bar">
        </div>
    </div>
    
    <script src="Music.js"></script> <!-- We'll create this next -->
</body>
</html>
